services:
  control-plane:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/control-plane.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - control-plane-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  control-plane-data:
