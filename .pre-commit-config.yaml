default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: uv-lock
        name: validate uv lockfile
        entry: uv lock --check
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types_or:
          - python
          - pyi
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or:
          - python
          - pyi
      - id: mypy
        name: mypy
        entry: uv run mypy app
        language: system
        pass_filenames: false
      - id: unit-tests
        name: unit tests
        entry: uv run pytest -q tests/unit
        language: system
        pass_filenames: false
        stages:
          - pre-push
      - id: integration-tests
        name: integration tests
        entry: uv run pytest -q tests/integration
        language: system
        pass_filenames: false
        stages:
          - pre-push
