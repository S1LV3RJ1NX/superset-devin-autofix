[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "superset-devin-autofix"
version = "0.1.0"
description = "Event-driven Devin remediation control plane"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "pydantic==2.11.7",
    "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
    "mypy==1.17.1",
    "pre-commit==4.2.0",
    "pytest==8.4.1",
    "ruff==0.12.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
exclude-newer = "2026-08-29T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["app"]
